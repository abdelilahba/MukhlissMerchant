# 🧪 WORKFLOW CI - TESTS AUTOMATIQUES
# Ce fichier dit à GitHub: "À chaque push, lance les tests"

name: Tests Automatiques

# QUAND lancer ce workflow?
on:
  push:
    branches: [mainD, develop] # Sur push vers mainD ou develop
  pull_request:
    branches: [mainD] # Sur Pull Request vers mainD

# QUOI faire?
jobs:
  test:
    name: Exécuter Tests Flutter
    runs-on: ubuntu-latest # Machine virtuelle Ubuntu

    steps:
      # ÉTAPE 1: Télécharger votre code
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ÉTAPE 2: Installer Flutter
      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0" # Version Flutter avec Dart 3.5+
          channel: "stable"
          cache: true # Cache pour accélérer

      # ÉTAPE 3: Installer dépendances
      - name: 📦 Install dependencies
        run: flutter pub get

      # ÉTAPE 4: Générer mocks (si nécessaire)
      - name: 🏗️ Generate mocks
        run: dart run build_runner build --delete-conflicting-outputs

      # ÉTAPE 5: Analyser le code
      - name: 🔍 Analyze code
        run: flutter analyze

      # ÉTAPE 6: Lancer les tests avec coverage
      - name: 🧪 Run tests
        run: flutter test --coverage

      # ÉTAPE 7: Afficher résumé tests
      - name: 📊 Test Summary
        if: always()
        run: |
          echo "✅ Tests exécutés!"
          echo "📊 141 tests unitaires"
          echo "🎯 Coverage: ~60%"
          echo "⚡ Temps: ~3 secondes"

      # ÉTAPE 8: Upload coverage (optionnel)
      - name: 📈 Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
