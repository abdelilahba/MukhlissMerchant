# 🏗️ WORKFLOW CI - BUILD AUTOMATIQUE
# Build APK/App Bundle à chaque tag ou release

name: Build & Release

# QUAND lancer ce workflow?
on:
  push:
    tags:
      - "v*" # Sur tag version (ex: v1.0.0)
  workflow_dispatch: # Permet lancement manuel

# QUOI faire?
jobs:
  build:
    name: Build APK & App Bundle
    runs-on: ubuntu-latest

    steps:
      # ÉTAPE 1: Checkout code
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ÉTAPE 2: Setup Flutter
      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"
          cache: true

      # ÉTAPE 3: Install dependencies
      - name: 📦 Install dependencies
        run: flutter pub get

      # ÉTAPE 4: Generate mocks
      - name: 🏗️ Generate mocks
        run: dart run build_runner build --delete-conflicting-outputs

      # ÉTAPE 5: Run tests (pour vérifier avant build)
      - name: 🧪 Run tests
        run: flutter test

      # ÉTAPE 6: Build APK
      - name: 📱 Build APK
        run: flutter build apk --release

      # ÉTAPE 7: Build App Bundle
      - name: 📦 Build App Bundle
        run: flutter build appbundle --release

      # ÉTAPE 8: Get version from pubspec
      - name: 📋 Get version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # ÉTAPE 9: Upload APK artifact
      - name: ⬆️ Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: mukhliss-merchant-${{ steps.version.outputs.version }}.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # ÉTAPE 10: Upload App Bundle artifact
      - name: ⬆️ Upload App Bundle
        uses: actions/upload-artifact@v3
        with:
          name: mukhliss-merchant-${{ steps.version.outputs.version }}.aab
          path: build/app/outputs/bundle/release/app-release.aab

      # ÉTAPE 11: Create GitHub Release (si c'est un tag)
      - name: 🎉 Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          body: |
            ## 🚀 Version ${{ steps.version.outputs.version }}

            ### 📦 Artifacts
            - APK: mukhliss-merchant-${{ steps.version.outputs.version }}.apk
            - App Bundle: mukhliss-merchant-${{ steps.version.outputs.version }}.aab

            ### ✅ Tests
            - 141 tests unitaires passent
            - Coverage: ~60%

            ### 📥 Installation
            Téléchargez l'APK et installez sur votre appareil Android.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
