# Configuration analyse statique Dart/Flutter
# Version progressive - commence avec règles de base Flutter

include: package:flutter_lints/flutter.yaml

analyzer:
  # Exclure fichiers générés
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "**/generated/**"
    - "build/**"

  # Erreurs critiques seulement
  errors:
    # Code vraiment mort
    dead_code: error

    # null safety critiques
    invalid_null_aware_operator: error

    # Le reste en warning (progression graduelle)
    avoid_print: info # Info seulement pour ne pas bloquer
    unused_import: info
    unused_element: info

linter:
  rules:
    # Seulement les règles essentielles
    # On ajoutera progressivement plus de règles

    # Éviter print (mais pas bloquer)
    avoid_print: false # Désactivé temporairement

    # Null safety
    unnecessary_null_checks: true

    # Best practices basiques
    use_key_in_widget_constructors: true
    prefer_const_constructors: false # Désactivé temporairement
